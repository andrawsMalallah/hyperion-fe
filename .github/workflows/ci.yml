name: CI

# Verifies the production build compiles on every push to main and on PRs.
# `npm run build` runs `vite build` in production mode, so it uses
# .env.production (the live API URL) — the same output that ships in dist/.
# Playwright browser tests are local-only by project preference.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keep Node 22 compatibility in CI; Render selects Node 24 LTS from
      # .node-version. The server and build support both maintained branches.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test production server
        run: npm run test:server

      - name: Build
        run: npm run build
